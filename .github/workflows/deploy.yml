name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Deploy whichever branch is the repository default, rather than hard-coding
    # a name: this repo's default is the branch the first push created, and this
    # keeps working unchanged if it is later renamed to main.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        # A project Pages site is served from /<repo>/, so vite needs a matching
        # base path. Passed on the command line because vite.config.js does not
        # read one from the environment.
        run: npm run build -- --base="/${GITHUB_REPOSITORY#*/}/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
